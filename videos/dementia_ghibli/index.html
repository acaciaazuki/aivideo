<script>
window.EPISODE = {
  strings: {
    zh: { eb:"WHAT IS DEMENTIA", sub:"當記憶迷了路", chip:"失智症 ＝ 一群症狀",
          okT:"正常的健忘", okC:"提醒之後<br>想得起來", badT:"失智警訊", badC:"提醒了也<br>想不起來",
          i1:"運動", n1:"不糾正", hello:"阿嬤，我是你孫女喔！",
          q11a:"他會慢慢忘了你，", q11b:"但請不要忘了他。", q12a:"記憶會迷路，", q12b:"但愛不會。" }
  },
  build(c) {
    const { m, S, L, LE, LM } = c;
    const NS = "http://www.w3.org/2000/svg", R = c.rng(11);
    const el = (tag, at, par) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); par.appendChild(e); return e; };
    const P = (id, t, d = .9, dy = 40) => m.fromTo(id, { opacity: 0, y: dy }, { opacity: 1, y: 0, duration: d, ease: "expo.out" }, t);
    const O = (id, t, d = .6) => m.to(id, { opacity: 0, y: -24, duration: d, ease: "power2.in" }, t);
    const pop = (id, t, d = .5) => m.fromTo(id, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(2.4)" }, t);

    /* 星星與燈籠（用固定亂數產生，每次渲染都一樣） */
    const stars = c.$("#stars"); c.state.stars = [];
    for (let i = 0; i < 46; i++) c.state.stars.push(el("circle", { cx: 20 + R() * 1080, cy: 10 + R() * 330, r: 1.2 + R() * 2.2, fill: "#FFF6D8" }, stars));
    const LX = [230, 450, 670, 890], LN = ["記憶", "語言", "判斷", "方向感"], lg = c.$("#lanterns");
    LX.forEach((x, k) => {
      const g = el("g", { transform: `translate(${x} 150) scale(1.4)` }, lg);
      el("circle", { id: "gl" + k, r: 130, fill: "url(#gGlow)", cy: 50 }, g);
      el("path", { d: "M0 -84 V-10", stroke: "#6B4F3F", "stroke-width": 4, fill: "none" }, g);
      el("rect", { x: -24, y: -12, width: 48, height: 14, rx: 4, fill: "#7A5A44" }, g);
      el("ellipse", { cx: 0, cy: 50, rx: 50, ry: 58, fill: "#6A5A78", stroke: "#6B4F3F", "stroke-width": 3 }, g);
      el("ellipse", { id: "lit" + k, cx: 0, cy: 50, rx: 50, ry: 58, fill: "url(#gLit)", stroke: "#6B4F3F", "stroke-width": 3 }, g);
      el("path", { d: "M-34 30 C-20 18 20 18 34 30 M-36 56 C-20 44 20 44 36 56", stroke: "#C9604A", "stroke-width": 3, fill: "none", opacity: .5 }, g);
      el("rect", { x: -24, y: 106, width: 48, height: 14, rx: 4, fill: "#7A5A44" }, g);
      el("path", { d: "M0 120 V150 M-7 150 H7", stroke: "#C9604A", "stroke-width": 5 }, g);
      const t = el("text", { id: "ln" + k, x, y: 470, "text-anchor": "middle", "font-family": "Noto Serif TC", "font-weight": 900, "font-size": 60, fill: "#FFF1D0" }, lg); t.textContent = LN[k];
    });
    // 鳥群
    c.state.birds = ["#b1", "#b2", "#b3"];

    /* S1 */
    c.hostTo({ opacity: 1, scale: .8 }, S(0).start + .2, .8);
    P("#p1", S(0).start + .2, 1.0);
    ["#qb1", "#qb2", "#qb3"].forEach((q, k) => pop(q, LM(0, 0, .42 + k * .18)));
    O("#p1", L(0, 1) - .3);
    c.rise("#title .eyebrow", L(0, 1) + .1, 1.0); c.rise("#title .h1", L(0, 1) + .25, 1.2); c.rise("#title .h2", L(0, 1) + .9, 1.0);

    /* S2：四盞燈籠依序變暗 */
    c.out("#title", S(1).start - .4);
    P("#p2", S(1).start + .1, 1.0); c.rise("#chip2", S(1).start + .4, .9, 24);
    [0, 1, 2, 3].forEach(k => {
      const t = LM(1, 0, .42 + k * .15);
      m.to("#lit" + k, { opacity: .1, duration: 1.1, ease: "power1.inOut" }, t);
      m.to("#gl" + k, { opacity: .08, duration: 1.1, ease: "power1.inOut" }, t);
      m.to("#ln" + k, { opacity: .5, duration: .8 }, t);
    });

    /* S3：提醒後想得起來 vs 想不起來 */
    O("#p2", S(2).start - .4); O("#chip2", S(2).start - .5);
    c.hostTo({ x: 0, scale: .62 }, S(2).start - .2, .9);
    P("#c3L", S(2).start + .2, 1.0);
    m.fromTo("#stL", { x: -140, y: -30, opacity: 0 }, { x: 0, y: 40, opacity: 1, duration: 1.0, ease: "power2.out" }, L(2, 0) + .35);
    m.to("#stL", { opacity: 0, scale: .2, duration: .4 }, L(2, 0) + 1.5);
    m.to("#litL", { opacity: 1, duration: .8 }, L(2, 0) + 1.4); m.to("#glL", { opacity: 1, duration: .8 }, L(2, 0) + 1.4);
    pop("#okL", L(2, 0) + 1.6);
    P("#c3R", L(2, 1) - .3, 1.0);
    m.fromTo("#stR", { x: -140, y: -30, opacity: 0 }, { x: 0, y: 40, opacity: 1, duration: 1.0, ease: "power2.out" }, L(2, 1) + .4);
    m.to("#stR", { opacity: 0, scale: .2, duration: .5 }, L(2, 1) + 1.6);
    m.to("#litR", { opacity: .3, duration: .3, yoyo: true, repeat: 1 }, L(2, 1) + 1.5);
    m.to("#fog", { opacity: 1, duration: 1.2 }, L(2, 1) + 1.6);
    pop("#warnR", LM(2, 1, .7));

    /* S4：小樹苗 */
    O(["#c3L", "#c3R"], S(3).start - .4);
    P("#p4", S(3).start + .1, 1.0);
    m.fromTo("#sunA", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 1.6, ease: "power2.out" }, S(3).start + .4);
    m.fromTo("#sap", { scale: .12, opacity: 0 }, { scale: .5, opacity: 1, duration: 1.0, ease: "back.out(1.6)" }, L(3, 0) + .3);
    ["#ic1", "#ic2", "#ic3", "#ic4"].forEach((id, k) => {
      const t = LM(3, 1, .1 + k * .2);
      pop(id, t, .55); pop("#t" + (k + 1), t + .15, .4);
      m.to("#sap", { scale: .5 + (k + 1) * .125, duration: .7, ease: "back.out(1.5)" }, t + .2);
    });

    /* S5 */
    O("#p4", S(4).start - .4);
    P("#p5a", S(4).start + .1, 1.0);
    m.fromTo("#walkIn", { x: -80 }, { x: 330, duration: LE(4, 0) - L(4, 0) + .4, ease: "sine.inOut" }, L(4, 0) - .1);
    O("#p5a", L(4, 1) - .3);
    P("#p5b", L(4, 1) - .1, 1.0);
    [1, 2, 3].forEach((k, i) => m.fromTo("#pl" + k, { opacity: 0, y: -160 }, { opacity: 1, y: 0, duration: .8, ease: "bounce.out" }, LM(4, 1, .3 + i * .27)));
    O("#p5b", L(4, 2) - .3);
    P("#p5c", L(4, 2) - .1, 1.0);
    pop("#bub", L(4, 2) + .4, .6);
    m.to("#hearts", { opacity: 1, y: -30, duration: 1.0 }, LE(4, 2) - .8);

    /* S6 */
    O("#p5c", S(5).start - .4);
    c.hostTo({ opacity: 0 }, S(5).start - .3, .8);
    P("#sun", S(5).start + .1, 1.2);
    m.fromTo("#walkers", { x: -380 }, { x: 0, duration: LE(5, 1) - S(5).start, ease: "none" }, S(5).start + .1);
    c.rise("#q11", L(5, 0) + .1, 1.1);
    m.to("#q11", { opacity: 0, y: -20, duration: .5, ease: "power2.in" }, L(5, 1) - .3);
    c.rise("#q12", L(5, 1) + .05, 1.2);
  },
  tick(t, c) {
    const sv = (id, tr) => { const e = c.$(id); if (e) e.setAttribute("transform", tr); };
    sv("#cl1", `translate(${(Math.sin(t * .18) * 40).toFixed(1)} 0)`);
    sv("#cl2", `translate(${(Math.sin(t * .13 + 2) * -36).toFixed(1)} 0)`);
    (c.state.stars || []).forEach((s, i) => s.setAttribute("opacity", (.55 + .45 * Math.sin(t * 1.6 + i * 1.7)).toFixed(2)));
    ["#f1", "#f2", "#f3"].forEach((id, i) => { const e = c.$(id); if (e) e.setAttribute("transform", `translate(${(Math.sin(t * .35 + i * 2) * 26).toFixed(1)} 0)`); });
    [["#pl1in", 370, 78], ["#pl2in", 630, 78], ["#pl3in", 890, 78]].forEach(([id, x, y], i) => sv(id, `rotate(${(Math.sin(t * 1.5 + i * 1.3) * 2.2).toFixed(2)} ${x} ${y})`));
    const wb = c.$("#walkIn"); // 走路時上下輕晃
    if (wb) wb.style.translate = `0 ${(Math.abs(Math.sin(t * 5)) * -5).toFixed(1)}px`;
    (c.state.birds || []).forEach((id, i) => sv(id, `translate(${(180 + i * 70 + (t * 38) % 1500).toFixed(1)} ${(130 + i * 34 + Math.sin(t * 1.4 + i) * 12).toFixed(1)})`));
    const wk = c.$("#walkers"); if (wk) wk.style.translate = `0 ${(Math.abs(Math.sin(t * 3.2)) * -4).toFixed(1)}px`;
  }
};
</script>
