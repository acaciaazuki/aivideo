<style>
/* ── 插畫風主題：暖色紙張底 + 墨色粗線 + 平塗色塊（覆寫深色範本的變數） ── */
:root{
  --cream:#3B2F2A; --gold:#E2703A; --champ:#B8742A; --rose:#E8715F; --mint:#3FA796; --muted:#8A7A6C;
  --line:rgba(59,47,42,.28); --glow-rgb:240,160,90;
  --ink:#3B2F2A; --paper:#FFFDF7; --yellow:#F6C453; --teal:#3FA796; --blue:#5B8DB8; --orange:#F08A4B; --red:#E8715F;
}
#frame{background:
  radial-gradient(900px 600px at 12% 10%,rgba(246,196,83,.28),transparent 60%),
  radial-gradient(900px 700px at 92% 95%,rgba(63,167,150,.20),transparent 60%),
  #FBF3E4}

#chrome{color:var(--muted)} #chrome .brandmark{color:var(--ink)}

#subbox b{color:var(--gold)}
.glass{background:var(--paper);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);backdrop-filter:none;border-radius:30px}
.sheen{mix-blend-mode:normal;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent)}
#host img{filter:none}
.abs{position:absolute!important}
.abs svg{overflow:visible}
#subbox{max-width:1600px}

/* ── 這一集的版面（1920×1080；上方 140 品牌列、下方 160 字幕區） ── */

<script>
window.EPISODE = {
  strings: {
    zh: { eb:"WHAT IS DEMENTIA", sub:"不是變老，而是生病了", lib:"大腦 ＝ 圖書館",
          okT:"正常的健忘", okD:"忘記鑰匙<br>放在哪裡", badT:"失智警訊", badD:"忘記鑰匙<br>是做什麼用的",
          i1:"說話", i1s:"詞不達意、找不到字", i2:"判斷", i2s:"做決定變得困難", i3:"方向感", i3s:"在熟悉的地方迷路",
          stamp:"不是正常老化", yl:"腦部功能", xl:"時間", mk:"早期發現", la:"太晚才發現", lb:"及早發現、延緩惡化",
          st1:"多陪伴", st2:"耐心聽", st3:"提醒就醫", q1:"他也許會忘了你，", q2:"但你不要忘了他。" }
  },
  build(c) {
    const { m, S, L, LE, LM } = c;
    const sh = c.$("#shelf");

    /* 書架：3 層、每層 9 本書，用固定亂數排列（每次渲染都一樣） */
    const R = c.rng(5), cols = ["#F08A4B", "#3FA796", "#F6C453", "#5B8DB8", "#E8715F", "#9B8FD0", "#7CC38C"];
    [0, 1, 2].forEach(r => {
      const b = document.createElement("div"); b.className = "board"; b.style.top = (r * 200 + 160) + "px"; sh.appendChild(b);
      for (let i = 0; i < 9; i++) {
        const h = 110 + Math.round(R() * 40), w = 58 + Math.round(R() * 18), k = document.createElement("div");
        k.className = "bk"; k.id = `b${r}${i}`; k.style.cssText = `left:${22 + i * 96}px;top:${r * 200 + 160 - h}px;width:${w}px;height:${h}px;background:${cols[(r * 3 + i * 2) % cols.length]}`;
        sh.appendChild(k);
      }
    });

    /* ─ S1：鉤子 ─ */
    c.hostTo({ opacity: 1, scale: .8 }, S(0).start + .2, .8);
    m.fromTo("#road", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .9, ease: "expo.out" }, S(0).start + .3);
    ["#q1", "#q2", "#q3"].forEach((q, k) => m.fromTo(q, { opacity: 0, scale: 0, rotation: -20 }, { opacity: 1, scale: 1, rotation: k * 8 - 8, duration: .45, ease: "back.out(2.5)" }, LM(0, 0, .45 + k * .18)));
    c.out("#road", L(0, 1) - .3, .6);
    c.rise("#title .eyebrow", L(0, 1) + .1, 1.0);
    c.rise("#title .h1", L(0, 1) + .25, 1.1);
    c.rise("#title .h2", L(0, 1) + .9, 1.0);

    /* ─ S2：圖書館比喻 ─ */
    c.out("#title", S(1).start - .4);
    c.rise("#chipL", S(1).start + .1, .9, 30);
    m.fromTo("#shelf", { opacity: 0 }, { opacity: 1, duration: .4 }, S(1).start + .2);
    m.fromTo(".board", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: .8, ease: "expo.out", stagger: .12 }, S(1).start + .25);
    m.fromTo(".bk", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: .5, ease: "back.out(2)", stagger: .035 }, L(1, 0) + .2);
    c.hostTo({ x: -60, scale: .8 }, S(1).start, .8);
    // 第 2 句：館員迷路，書歪掉、錯位、消失
    const t2 = L(1, 1);
    m.to("#chipL", { opacity: 0, y: -20, duration: .3 }, t2 - .05);
    m.call(() => { c.$("#chipL").innerHTML = "失智症 ＝ 館員迷路"; c.$("#chipL").classList.add("bad"); }, null, t2 + .06);
    m.to("#chipL", { opacity: 1, y: 0, duration: .4, ease: "back.out(2)" }, t2 + .07);
    c.hostTo({ x: -120 }, t2, 1.1); c.hostTo({ x: 10 }, t2 + 1.4, 1.2); c.hostTo({ x: -90 }, t2 + 3, 1.2);
    m.fromTo("#wonder", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: .4, ease: "back.out(3)" }, t2 + .3);
    // 書歪了
    ["b02", "b05", "b11", "b17", "b23"].forEach((id, k) => m.to("#" + id, { rotation: (k % 2 ? 1 : -1) * (24 + k * 5), x: (k % 2 ? 1 : -1) * 16, duration: .5, ease: "back.out(2)" }, LM(1, 1, .3 + k * .05)));
    // 找不到、放錯位（跳到別層）
    [["b04", 200], ["b13", -200], ["b21", -200]].forEach(([id, dy], k) => m.to("#" + id, { y: dy, duration: .7, ease: "power3.inOut" }, LM(1, 1, .5 + k * .06)));
    // 一頁一頁消失
    ["b00", "b08", "b10", "b14", "b19", "b22", "b26", "b15"].forEach((id, k) => m.to("#" + id, { opacity: 0, y: "-=60", duration: .7, ease: "power1.in" }, LM(1, 1, .62 + k * .045)));

    /* ─ S3：正常健忘 vs 警訊 ─ */
    c.out(["#shelf", "#chipL", "#wonder"], S(2).start - .4);
    c.hostTo({ x: 0, scale: .62 }, S(2).start - .2, .9);
    c.rise("#cardL", S(2).start + .2, 1.0);
    m.fromTo("#okL", { opacity: 0, scale: 0, rotation: -40 }, { opacity: 1, scale: 1, rotation: 8, duration: .5, ease: "back.out(3)" }, L(2, 0) + .5);
    c.sheen("#cardL", L(2, 0) + .3);
    c.rise("#cardR", L(2, 1) - .3, 1.0);
    m.fromTo("#warnR", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: .5, ease: "back.out(3)" }, LM(2, 1, .55));
    m.to("#warnR", { scale: 1.18, duration: .28, yoyo: true, repeat: 3, ease: "sine.inOut" }, LM(2, 1, .7));
    c.sheen("#cardR", LM(2, 1, .5));

    /* ─ S4：影響 + 早期發現 ─ */
    c.out(["#cardL", "#cardR"], S(3).start - .4);
    ["#ic1", "#ic2", "#ic3"].forEach((id, k) => m.fromTo(id, { opacity: 0, y: 70, scale: .9 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: "back.out(1.8)" }, LM(3, 0, .5 + k * .17)));
    c.out(["#ic1", "#ic2", "#ic3"], L(3, 1) - .3);
    m.fromTo("#stamp", { opacity: 0, scale: 2.4, rotation: -14 }, { opacity: 1, scale: 1, rotation: -3, duration: .4, ease: "power4.in" }, L(3, 1) + .1);
    m.fromTo("#chart", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: .8, ease: "expo.out" }, L(3, 1) + .1);
    m.fromTo("#ca", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" }, LM(3, 1, .35));
    m.fromTo(["#cm", "#cd", "#ct"], { opacity: 0 }, { opacity: 1, duration: .5 }, LM(3, 1, .55));
    m.fromTo("#cb", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, LM(3, 1, .62));
    m.fromTo(["#la", "#lb"], { opacity: 0 }, { opacity: 1, duration: .5, stagger: .5 }, LM(3, 1, .75));

    /* ─ S5：陪伴與收尾 ─ */
    c.out(["#chart", "#stamp"], S(4).start - .4);
    c.rise("#care", S(4).start + .1, 1.0);
    m.fromTo("#heart", { opacity: 0, y: 20, scale: 0 }, { opacity: 1, y: -30, scale: 1, duration: .8, ease: "back.out(2.5)" }, S(4).start + 1.0);
    m.to("#heart", { y: -52, duration: .9, yoyo: true, repeat: 5, ease: "sine.inOut" }, S(4).start + 1.8);
    ["#s1", "#s2", "#s3"].forEach((id, k) => c.rise(id, [LM(4, 0, .22), LM(4, 0, .5), LM(4, 0, .78)][k], .8, 30));
    c.out(["#care", "#heart", "#s1", "#s2", "#s3"], L(4, 1) - .4);
    c.hostTo({ x: -40, y: 0, scale: .85 }, L(4, 1) - .3, 1.0);
    c.rise("#quote .h2:not(.big)", L(4, 1) + .1, 1.0);
    c.rise("#quote .big", LM(4, 1, .55), 1.0);
  }
};
</script>
